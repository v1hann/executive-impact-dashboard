name: Refresh stock performance data

on:
  schedule:
    # 11:15 UTC = 4:45pm IST, after NSE market close (15:30 IST)
    - cron: "15 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest stock performance data
        run: node scripts/fetch_stock_data.js

      - name: Commit and push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          if ! git diff --quiet -- data/stock_cache.json; then
            git add data/stock_cache.json
            git commit -m "Auto-refresh stock performance data ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to stock_cache.json"
          fi
